[project]
name = "fsr-protocol-editor"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
ASSOCIATED_MEMBERS = { description = "ASSOCIATED_MEMBERS secret", required = true }
DEFAULT_LOCATION = { description = "DEFAULT_LOCATION secret", required = true }
DEFAULT_ROOM = { description = "DEFAULT_ROOM secret", required = true }
DEFAULT_START_TIME = { description = "DEFAULT_START_TIME secret", required = true }
DISCORD_PASSWORD = { description = "DISCORD_PASSWORD secret", required = false }
DISCORD_WEBHOOK_URL = { description = "DISCORD_WEBHOOK_URL secret", required = true }
FSR_MEMBERS = { description = "FSR_MEMBERS secret", required = true }
# DATABASE_URL = { description = "Database connection string", required = true }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
